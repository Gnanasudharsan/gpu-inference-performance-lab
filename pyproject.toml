[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gpulab"
version = "0.1.0"
description = "GPU Inference Performance Lab: reproducible low-latency inference optimization and benchmarking"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Gnanasudharsan Ashokumar" }]
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
analysis = ["pandas>=2.1", "pyarrow>=15"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
triton = ["triton>=3.1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "httpx>=0.27",
  "pandas>=2.1",
  "pyarrow>=15",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.scripts]
gpulab = "gpulab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpulab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "mps: requires Apple MPS backend",
  "cuda: requires an NVIDIA CUDA device",
  "triton: requires triton (real GPU or TRITON_INTERPRET=1)",
  "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "S"]
ignore = ["N803", "N806", "N812", "RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]
"src/gpulab/kernels/triton_*.py" = ["N802", "E741", "SIM108"]
"src/gpulab/analysis_report.py" = ["E501"]  # markdown table templates

[tool.mypy]
python_version = "3.12"
files = ["src/gpulab"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["gpulab.kernels.triton_kernels"]
disallow_untyped_defs = false
