name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, tests (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install (CPU-only torch)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m gpulab.cli env
      - run: make lint
      - run: make typecheck
      - run: .venv/bin/python -m pytest --cov=gpulab --cov-report=term-missing
      - name: experiment pipeline smoke test (runner + analysis)
        run: |
          .venv/bin/gpulab experiment experiments/smoke.toml --out /tmp/smoke
          test -s /tmp/smoke/bench.jsonl && test -s /tmp/smoke/manifest.json

  triton-interpreter:
    name: Triton kernels via TRITON_INTERPRET=1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install (CPU torch + triton)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install --python .venv/bin/python -e ".[dev,triton]"
      - run: .venv/bin/python -m gpulab.cli env
      - name: interpreter correctness tests
        env:
          TRITON_INTERPRET: "1"
        run: .venv/bin/python -m pytest -m triton -v

  dashboard:
    name: dashboard build (static export)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: test -f out/index.html && test -f out/data/summary.json && test -f out/live/index.html
