# Full local matrix on Apple silicon (MPS + CPU). Every comparison is interleaved and paired.
name = "apple_m4"
description = "Baseline vs optimized implementations on the Apple M4 GPU (MPS) and CPU."

[[bench]]
device = "mps"
dtype = "float16"
impls = ["eager", "fused_weights", "compile", "metal"]
rows = [1, 2, 4, 8, 16, 32, 64]
deadline_us = 2000

[[bench]]
device = "mps"
dtype = "float32"
impls = ["eager", "fused_weights", "compile", "metal"]
rows = [1, 8, 32]

[[bench]]
device = "mps"
dtype = "bfloat16"
impls = ["eager", "fused_weights", "compile", "metal"]
rows = [1, 8, 32]

[[bench]]
device = "mps"
dtype = "float16"
impls = ["eager", "fused_weights", "compile", "metal"]
rows = [1, 8]
d_model = 512
d_hidden = 1408

[[bench]]
device = "mps"
dtype = "float16"
impls = ["eager", "fused_weights", "compile", "metal"]
rows = [1, 8]
d_model = 2048
d_hidden = 5632
iters = 200

[[bench]]
device = "cpu"
dtype = "float32"
impls = ["eager", "fused_weights", "compile"]
rows = [1, 8, 32]
iters = 100
trials = 10
burst = 10

[[serving]]
device = "mps"
dtype = "float16"
impls = ["eager", "metal", "compile"]
policies = ["direct", "static8", "dynamic"]
rates = [50, 100, 200, 300, 400, 600, 800, 1200, 1600]
duration_s = 3.0
deadline_us = 10000
